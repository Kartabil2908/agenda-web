name: CI/CD Pipeline - Agenda Web (Java + React + Render)

on:
  push:
    branches: [ deploy ]
  pull_request:
    branches: [ deploy ]

jobs:
  # ========================================
  # JOB 1: TESTES DO BACKEND (Java/Spring Boot)
  # ========================================
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Testes unitários (JUnit 5 + Mockito)
        run: mvn test -Dtest="*ControllerTest" -B

      - name: 🔗 Testes de integração (Spring Boot + PostgreSQL via Testcontainers)
        run: mvn test -Dtest="IntegracaoTest" -B

      - name: 📊 Cobertura de código (JaCoCo)
        run: |
          mvn verify -B
          echo "✅ Relatório de cobertura gerado em target/site/jacoco/"

  # ========================================
  # JOB 2: TESTES DO FRONTEND (React)
  # ========================================
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 📦 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🧪 Testes unitários React (Jest)
        run: npm test -- --coverage --watchAll=false

      - name: 🏗️ Build de produção
        run: npm run build

  # ========================================
  # JOB 3: ACEITAÇÃO LOCAL ANTES DO RENDER
  # O Render publica automaticamente após os checks passarem.
  # ========================================
  acceptance:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐳 Build das imagens Docker
        run: docker compose build

      - name: ✅ Testes de aceitação (Docker Compose + HTTP)
        run: |
          docker compose up -d
          sleep 30
          curl -f http://localhost:8080/api/contatos
          curl -f http://localhost:3000
          echo "✅ Testes de aceitação passaram; Render fará o deploy após os checks."

      - name: 🧹 Encerrar containers
        if: always()
        run: docker compose down -v
